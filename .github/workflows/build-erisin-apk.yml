name: Build APK (Erisin ES8189C)

# Manual build of a sideloadable APK (arm + arm64) for Android head units.
# Actions tab -> "Build APK (Erisin ES8189C)" -> "Run workflow".
# The APK is attached to the run as an artifact (~20-30 min on a cold cache).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: flutter build apk (full flavor)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Optional: define these 4 repository secrets to sign with your own key,
      # so a new build installs over the previous one. Without them the APK is
      # debug-signed and the old build must be uninstalled first.
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.8"
          channel: stable
          cache: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      # android/app/build.gradle.kts (copyNdkLibs) copies libc++_shared.so from
      # $ANDROID_NDK_HOME. Point it at the NDK that Flutter/AGP actually use so
      # the C++ runtime matches the one the Rust/Oboe code is built against.
      - name: Select Flutter's default NDK
        run: |
          set -euo pipefail
          FLUTTER_ROOT="$(dirname "$(dirname "$(readlink -f "$(which flutter)")")")"
          EXT="$FLUTTER_ROOT/packages/flutter_tools/gradle/src/main/kotlin/FlutterExtension.kt"
          NDK_VERSION="$(grep -oE 'ndkVersion: String = "[0-9.]+"' "$EXT" | grep -oE '[0-9]+(\.[0-9]+){2}' || true)"
          test -n "$NDK_VERSION"
          echo "Flutter default NDK: $NDK_VERSION"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION"
          NDK_PATH="$ANDROID_HOME/ndk/$NDK_VERSION"
          NDK_SYSROOT="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          test -d "$NDK_SYSROOT"
          {
            echo "ANDROID_NDK_HOME=$NDK_PATH"
            echo "ANDROID_NDK_ROOT=$NDK_PATH"
            echo "BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android=--target=aarch64-linux-android26 --sysroot=$NDK_SYSROOT"
            echo "BINDGEN_EXTRA_CLANG_ARGS_armv7_linux_androideabi=--target=armv7-linux-androideabi26 --sysroot=$NDK_SYSROOT"
          } >> "$GITHUB_ENV"

      - name: Use my own signing key (optional)
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          {
            echo "storeFile=app/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --flavor full --release --target-platform android-arm,android-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: flick-erisin-es8189c-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
